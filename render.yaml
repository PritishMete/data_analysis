services:
  - type: web
    name: data-analysis-api
    runtime: python
    branch: feature/data-workspace
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python tools/run_authz_migrations.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: INSIGHTFLOW_PRIVACY_MODE
        value: local_only
      - key: SUPABASE_PROJECT_REF
        value: zfdgwnipdyrpbardqoql
      - key: AUTHZ_PERSISTENCE_PROVIDER
        value: supabase
      - key: AUTHN_PROVIDER_MODE
        value: supabase
      - key: INSIGHTFLOW_AUTH_REQUIRED
        value: "true"
      - key: INSIGHTFLOW_EMPLOYEE_INVITE_REDIRECT
        value: https://pritishmete.github.io/data_analysis/employee-invite
      - key: SUPABASE_SECRET_KEY
        sync: false
