<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsightFlow — Pivot Builder</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;color:#e3e6ed}
body{min-height:100vh;background:#0f111a;overflow:auto}
body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 12s ease-in-out infinite}
body:before{width:420px;height:420px;left:-100px;top:-80px;background:rgba(0,229,255,.22)}
body:after{width:460px;height:460px;right:-120px;bottom:-120px;background:rgba(51,153,255,.18);animation-delay:-5s}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(65px);opacity:.2}
.b1{width:360px;height:360px;background:#00e5ff;left:18%;top:42%;animation:float2 15s ease-in-out infinite}
.b2{width:300px;height:300px;background:#00ff66;right:20%;top:8%;animation:float2 17s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(35px,25px) scale(1.08)}}@keyframes float2{50%{transform:translate(-35px,35px) scale(1.12)}}
.shell{position:relative;width:min(720px,calc(100% - 28px));margin:28px auto 40px}
.top{padding:13px 18px;border:1px solid rgba(0,229,255,.22);background:rgba(20,24,36,.48);backdrop-filter:blur(16px) saturate(1.1);border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.28);display:flex;align-items:center;gap:12px}
.brand{font-size:14px;letter-spacing:1.5px;font-weight:700}.secure{margin-left:auto;border:1px solid rgba(0,255,102,.38);background:rgba(0,255,102,.09);color:#00ff66;padding:5px 9px;border-radius:999px;font-size:9px;letter-spacing:1px}
.panel{margin-top:14px;padding:22px;border:1px solid rgba(0,229,255,.18);background:rgba(20,24,36,.52);backdrop-filter:blur(18px) saturate(1.1);border-radius:22px;box-shadow:0 30px 100px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.045)}
.header{display:flex;align-items:center;gap:12px;padding-bottom:17px;margin-bottom:17px;border-bottom:1px solid rgba(0,229,255,.13)}
.icon{width:42px;height:42px;border:1px solid rgba(0,229,255,.25);background:rgba(0,229,255,.07);border-radius:13px;display:grid;place-items:center;color:#00e5ff;font-size:17px}
h1{font-size:15px;margin:0 0 5px;letter-spacing:.2px} .sub{font-size:10px;color:#67738c}
.badge{margin-left:auto;color:#00ff66;border:1px solid rgba(0,255,102,.4);background:rgba(0,255,102,.08);padding:5px 9px;border-radius:999px;font-size:9px;letter-spacing:.8px}
.section{padding:15px;border:1px solid rgba(0,229,255,.13);background:rgba(20,24,36,.35);backdrop-filter:blur(8px);border-radius:16px;margin-bottom:12px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:10px;color:#8d98ae;letter-spacing:.5px;font-weight:700}
.add{width:27px;height:27px;border:1px solid rgba(0,229,255,.2);background:rgba(0,229,255,.06);color:#00e5ff;border-radius:9px;cursor:pointer;font:inherit}
.row{display:flex;gap:8px;margin-bottom:8px}.row:last-child{margin-bottom:0}
.select{position:relative;flex:1}
select{width:100%;appearance:none;border:1px solid rgba(0,229,255,.13);background:rgba(20,24,36,.46);color:#e3e6ed;border-radius:12px;padding:11px 34px 11px 12px;font:11px ui-monospace,monospace;outline:none;cursor:pointer}
select:focus{border-color:#00e5ff;box-shadow:0 0 0 2px rgba(0,229,255,.08),0 0 22px rgba(0,229,255,.08)}
.select:after{content:"⌄";position:absolute;right:12px;top:8px;color:#67738c;pointer-events:none}
.remove{width:36px;border:1px solid rgba(255,51,102,.13);background:rgba(255,51,102,.05);color:#9b6a78;border-radius:10px;cursor:pointer;font:13px ui-monospace,monospace}
.actions{display:flex;gap:10px;margin-top:18px}.primary,.secondary{width:100%;height:46px;border-radius:14px;font:700 11px ui-monospace,monospace;cursor:pointer}
.primary{border:1px solid rgba(0,229,255,.3);background:rgba(0,229,255,.12);color:#e3e6ed;box-shadow:inset 0 1px rgba(255,255,255,.06),0 8px 30px rgba(0,229,255,.06)}
.secondary{border:1px solid rgba(0,229,255,.1);background:rgba(20,24,36,.3);color:#7f8ba1}
.primary:hover{border-color:#00e5ff;box-shadow:0 0 25px rgba(0,229,255,.12)}button:active{transform:translateY(1px)}
.note{text-align:center;color:#4f5b70;font-size:9px;margin-top:13px}
@media(max-width:560px){.shell{margin-top:14px}.panel{padding:15px}.section{padding:12px}.actions{flex-direction:column}.badge{display:none}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<main class="shell">
  <div class="top"><div class="brand">INSIGHTFLOW</div><div class="secure">SECURE</div></div>
  <section class="panel">
    <div class="header">
      <div class="icon">▦</div>
      <div><h1>Pivot Sheet</h1><div class="sub">Live pivot workspace — edits apply in place</div></div>
      <div class="badge">ACTIVE</div>
    </div>
    <div id="sections"></div>
    <div class="actions"><button class="primary" onclick="applyChanges()">↻ &nbsp; RE-APPLY CHANGES</button></div>
    <div class="note">Standalone visual preview of the Pivot Builder UI</div>
  </section>
</main>
<script>
const data={
"Row fields":["cuisine","city","country","rating"],
"Column fields":["year","region","price_range"],
"Filter fields":["country","rating","votes"],
"Value fields":[["cost","Sum"],["rating","Average"]]
};
const options=["cuisine","city","country","rating","year","region","price_range","votes","cost"];
const ops=["Sum","Average","Count","Max","Min"];
const root=document.getElementById("sections");
function select(opts,val){return '<div class="select"><select>'+opts.map(x=>'<option '+(x===val?'selected':'')+'>'+x+'</option>').join("")+'</select></div>'}
function render(){
 root.innerHTML="";
 Object.entries(data).forEach(([title,vals])=>{
  const sec=document.createElement("div");sec.className="section";
  const head=document.createElement("div");head.className="section-title";
  const label=document.createElement("span");label.textContent=title.toUpperCase();
  const add=document.createElement("button");add.className="add";add.textContent="+";
  add.onclick=()=>{if(title==="Value fields") vals.push(["cost","Sum"]); else vals.push(options[0]);render()};
  head.append(label,add);sec.append(head);
  vals.forEach((v,i)=>{
   const row=document.createElement("div");row.className="row";
   if(title==="Value fields"){
    row.innerHTML=select(options,v[0])+select(ops,v[1]);
    row.querySelectorAll("select")[0].onchange=e=>v[0]=e.target.value;
    row.querySelectorAll("select")[1].onchange=e=>v[1]=e.target.value;
   }else{
    row.innerHTML=select(options,v);
    row.querySelector("select").onchange=e=>vals[i]=e.target.value;
   }
   if(vals.length>1){const rm=document.createElement("button");rm.className="remove";rm.textContent="×";rm.onclick=()=>{vals.splice(i,1);render()};row.append(rm)}
   sec.append(row);
  });
  root.append(sec);
 });
}
function applyChanges(){const b=document.querySelector(".primary");const old=b.innerHTML;b.textContent="✓  CHANGES APPLIED";setTimeout(()=>b.innerHTML=old,900)}
render();
</script>
</body>
</html>
