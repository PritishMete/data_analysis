name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-history:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go for pinned Gitleaks CLI
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan complete Git history with redacted findings
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source "$GITHUB_WORKSPACE" \
            --log-opts="--all" \
            --redact \
            --exit-code 1

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit production requirements
        run: pip-audit -r requirements.txt
      - name: Audit test requirements
        run: pip-audit -r requirements-test.txt

  repository-dependencies:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan Python and Flutter lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            --recursive
            .
