name: InsightFlow Backend CI

on:
  # `main` is the currently configured Render source.
  # `main` remains the repository default branch but is not silently treated as
  # the production implementation until a reviewed release synchronization occurs.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: insightflow_authz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insightflow_authz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/insightflow_authz_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile migration runner and integration tests
        run: python -m py_compile tools/run_authz_migrations.py tests/test_authz_assignment_index_verification.py tests/test_authz_assignment_index_postgres.py tests/test_supabase_function_privilege_hardening.py tests/test_supabase_function_privilege_hardening_postgres.py tests/test_password_verification_attempt_hook_postgres.py
      - name: Run assignment index unit tests
        run: pytest -q tests/test_authz_assignment_index_verification.py
      - name: Run disposable PostgreSQL migration integration tests
        run: pytest -q -rs tests/test_authz_assignment_index_postgres.py
      - name: Run Supabase function privilege migration integration test
        run: pytest -q -rs tests/test_supabase_function_privilege_hardening_postgres.py
      - name: Require disposable PostgreSQL test database
        run: python -c "import os; assert os.environ.get('AUTHZ_TEST_DATABASE_URL', '').strip(), 'AUTHZ_TEST_DATABASE_URL is required; refusing to skip security integration tests'"
      - name: Run password verification hook concurrency integration test
        run: pytest -q -rs tests/test_password_verification_attempt_hook_postgres.py

  query-history-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m pip install 'pytest-timeout>=2.3,<3'
      - name: Run complete query-history integration suite with hard per-test timeout
        run: |
          pytest -vv tests/test_query_history.py --timeout=120 --timeout-method=signal --durations=25

  backend-foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Python static analysis on dataset authorization changes
        run: |
          python -m pip install ruff
          ruff check --select E4,E7,E9,F \
            dataset_storage/manager_grants.py dataset_storage/proposals.py dataset_storage/routes.py dataset_storage/service.py \
            firebase_authz/supabase_provider.py \
            tests/test_dataset_proposals.py tests/test_active_assignment_authorization_contract.py \
            tests/test_managed_dataset_role_policy.py tests/test_dataset_upload_scope_authorization.py \
            tests/test_management_ui_policy_contract.py tests/test_management_location_update_contract.py \
            tests/integration/test_postgres_manager_grant_races.py \
            tools/run_authz_migrations.py
          ruff check --select E4,E7,E9,F --ignore E701,E702 firebase_authz/management_domain.py

      - name: Verify authorization migration runner
        run: |
          python -m py_compile tools/run_authz_migrations.py
          python tools/run_authz_migrations.py --help >/dev/null

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase emulator test dependencies
        run: npm install

      - name: Run RTDB/Auth emulator security tests
        run: npm run test:rules

      - name: Run Firebase authorization unit tests
        run: pytest -q tests/test_firebase_authz.py tests/test_firebase_authz_api.py tests/test_office_mutation_boundary.py

      - name: Run Data Workspace focused tests
        run: pytest -q tests/test_data_workspace_foundation.py tests/test_data_workspace_semantics.py

      - name: Run managed dataset ingestion and storage tests
        run: pytest -q tests/test_managed_dataset_storage.py tests/test_managed_dataset_structured_storage.py

  backend-regression-tests:
    name: Backend regression shard ${{ matrix.group }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies and deterministic pytest sharding
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m pip install 'pytest-timeout>=2.3,<3' 'pytest-split==0.11.0'
      - name: Run complete backend regression suite shard
        env:
          PYTEST_SPLIT_GROUP: ${{ matrix.group }}
        run: |
          # The four GitHub jobs provide parallelism. Keep each shard serial to
          # avoid nested xdist workers and shared-state contention inside a shard.
          pytest -vv --timeout=120 --timeout-method=signal \
            --splits 4 --group "${PYTEST_SPLIT_GROUP}" --splitting-algorithm least_duration \
            --durations=25 --ignore=tests/test_query_history.py --ignore=tests/test_detail_upload.py --ignore=tests/test_password_verification_attempt_hook_postgres.py

  detail-upload-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m pip install 'pytest-timeout>=2.3,<3'
      - name: Run complete detail-upload regression module
        run: |
          pytest -vv tests/test_detail_upload.py --timeout=120 --timeout-method=signal --durations=25

  context-state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run context-state acceptance unit tests
        run: pytest -q tests/test_assistant_identity.py tests/test_conversation_state.py

  flutter-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set up Node for Excel auth bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Excel one-time authentication bridge
        run: node test/excel_auth_bridge_test.js

      - name: Check Excel auth Dart formatting
        run: >-
          dart format
          --output=none
          lib/features/auth/excel_auth_gate.dart
          lib/core/interop/excel_auth_bridge_web.dart
          lib/core/interop/excel_auth_bridge_stub.dart
          test/excel_auth_gate_recovery_test.dart

      - name: Analyze Excel auth Flutter sources
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/auth/excel_auth_gate.dart
          lib/core/interop/excel_auth_bridge.dart
          lib/core/interop/excel_auth_bridge_web.dart
          lib/core/interop/excel_auth_bridge_stub.dart
          test/excel_auth_gate_recovery_test.dart

      - name: Run Excel auth recovery tests
        run: >-
          flutter test
          test/excel_auth_gate_recovery_test.dart
          test/excel_auth_diagnostics_test.dart

      - name: Analyze Supabase Auth Flutter sources
        run: >-
          dart analyze
          lib/core/auth/authenticated_http.dart
          lib/core/auth/supabase_auth_service.dart

      - name: Check auth UI Dart formatting
        run: >-
          dart format
          --output=none
          lib/features/auth/auth_glass_widgets.dart
          lib/features/auth/sign_in_screen.dart
          lib/features/auth/sign_up_screen.dart
          lib/features/auth/auth_gate.dart
          lib/features/auth/employee_invitation_password_setup_screen.dart
          lib/features/auth/organization_onboarding_screen.dart
          lib/features/auth/account_management_screen.dart
          lib/features/auth/authorization_management_screen.dart
          lib/features/auth/management_shell.dart
          lib/features/auth/management_navigation.dart
          lib/features/auth/managed_dataset_access_workspace.dart
          lib/features/dashboard/data_screen.dart
          lib/core/auth/authenticated_http.dart
          lib/core/auth/supabase_auth_service.dart
          lib/core/interop/excel_mutation_authorization.dart
          test/auth_screens_test.dart
          test/supabase_multi_device_session_test.dart
          test/onboarding_auth_flow_contract_test.dart
          test/management_shell_contract_test.dart
          test/management_skeleton_responsive_test.dart
          lib/features/analysis/ai_analytics_workspace.dart
          test/ai_analytics_workspace_contract_test.dart
          test/analytics_reference_workspace_contract_test.dart
          test/main_auth_gate_entrypoint_test.dart

      - name: Analyze auth UI Flutter sources
        run: >-
          flutter analyze
          --no-fatal-infos
          lib/features/auth/auth_glass_widgets.dart
          lib/features/auth/sign_in_screen.dart
          lib/features/auth/sign_up_screen.dart
          lib/features/auth/auth_gate.dart
          lib/features/auth/employee_invitation_password_setup_screen.dart
          lib/features/auth/organization_onboarding_screen.dart
          lib/features/auth/account_management_screen.dart
          lib/features/auth/authorization_management_screen.dart
          lib/features/auth/management_shell.dart
          lib/features/auth/management_navigation.dart
          test/management_shell_contract_test.dart
          test/management_skeleton_responsive_test.dart
          lib/core/auth/authenticated_http.dart
          lib/core/interop/excel_mutation_authorization.dart
          test/auth_screens_test.dart

      - name: Analyze legacy dataset workspace and AI destination
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/features/auth/managed_dataset_access_workspace.dart \
            lib/features/dashboard/data_screen.dart

      - name: Run Flutter Auth tests
        run: >-
          flutter test
          test/supabase_only_auth_contract_test.dart
          test/management_shell_contract_test.dart
          test/managed_dataset_upload_contract_test.dart
          test/supabase_multi_device_session_test.dart
          test/onboarding_auth_flow_contract_test.dart
          test/ai_analytics_workspace_contract_test.dart
          test/analytics_reference_workspace_contract_test.dart
          test/main_auth_gate_entrypoint_test.dart

      - name: Analyze analytics workspaces and reference guide
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/analysis/ai_analytics_workspace.dart
          lib/features/analysis/analytics_reference_workspace.dart
          test/ai_analytics_workspace_contract_test.dart
          test/analytics_reference_workspace_contract_test.dart

      - name: Build Flutter web
        run: >-
          flutter build web --release
          --no-wasm-dry-run
          --base-href=/data_analysis/
