name: InsightFlow Backend CI

on:
  push:
    branches: [main, feature/data-workspace, feature/employee-management-cell, fix/supabase-only-auth-20261012]
  pull_request:
    branches: [main, feature/employee-management-cell]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Verify authorization migration runner
        run: |
          python -m py_compile tools/run_authz_migrations.py
          python tools/run_authz_migrations.py --help >/dev/null

      - name: Reject active Firebase Auth or RTDB persistence references
        run: bash .github/scripts/check_no_active_firebase.sh

      - name: Run Supabase identity and persistence-boundary regression tests
        run: pytest -q tests/test_supabase_only_persistence.py

      - name: Run duplicate identity regression tests
        run: pytest -q tests/test_profile_identity_uniqueness.py

      - name: Test identity uniqueness migration against disposable PostgreSQL
        env:
          IDENTITY_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/test_identity_uniqueness_migration.py

      - name: Apply authorization migrations and run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f tests/sql/supabase_compat.sql
          python tools/run_authz_migrations.py
          pytest -q tests/test_supabase_provider.py tests/test_management_domain.py

      - name: Run Supabase authentication and authorization API tests
        run: pytest -q tests/test_supabase_authz_api.py tests/test_supabase_only_auth.py tests/test_supabase_only_persistence.py tests/test_office_mutation_boundary.py

      - name: Run protected-path tests with authentication required
        env:
          INSIGHTFLOW_AUTH_REQUIRED: "true"
        run: |
          test "$INSIGHTFLOW_AUTH_REQUIRED" = "true"
          pytest -q tests/test_supabase_authz_api.py tests/test_managed_dataset_middleware.py

      - name: Run Data Workspace focused tests
        run: pytest -q tests/test_data_workspace_foundation.py tests/test_data_workspace_semantics.py

      - name: Run managed dataset ingestion and storage tests
        run: pytest -q tests/test_managed_dataset_storage.py tests/test_managed_dataset_structured_storage.py

      - name: Run backend regression suite
        run: pytest -q

      - name: Run context-state acceptance unit tests
        run: pytest -q tests/test_assistant_identity.py tests/test_conversation_state.py

  flutter-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_detail_source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Supabase Auth Flutter sources
        run: >-
          dart analyze
          lib/core/auth/insightflow_auth_service.dart
          lib/core/auth/authenticated_http.dart

      - name: Check auth UI Dart formatting
        run: >-
          dart format
          --output=none
          lib/features/auth/auth_glass_widgets.dart
          lib/features/auth/sign_in_screen.dart
          lib/features/auth/sign_up_screen.dart
          lib/features/auth/auth_gate.dart
          lib/features/auth/employee_invitation_password_setup_screen.dart
          lib/features/auth/organization_onboarding_screen.dart
          lib/features/auth/account_management_screen.dart
          lib/features/auth/authorization_management_screen.dart
          lib/features/auth/management_shell.dart
          lib/features/auth/management_navigation.dart
          lib/core/auth/insightflow_auth_service.dart
          lib/core/auth/authenticated_http.dart
          lib/core/interop/excel_mutation_authorization.dart
          lib/features/auth/company_registration_screen.dart
          lib/features/auth/employee_profile_onboarding_screen.dart
          test/auth_screens_test.dart
          test/profile_onboarding_contract_test.dart
          test/supabase_auth_service_test.dart

      - name: Analyze auth UI Flutter sources
        run: >-
          flutter analyze
          lib/features/auth/auth_glass_widgets.dart
          lib/features/auth/sign_in_screen.dart
          lib/features/auth/sign_up_screen.dart
          lib/features/auth/auth_gate.dart
          lib/features/auth/employee_invitation_password_setup_screen.dart
          lib/features/auth/organization_onboarding_screen.dart
          lib/features/auth/account_management_screen.dart
          lib/features/auth/authorization_management_screen.dart
          lib/features/auth/management_shell.dart
          lib/core/auth/insightflow_auth_service.dart
          lib/core/auth/authenticated_http.dart
          lib/core/interop/excel_mutation_authorization.dart
          lib/features/auth/company_registration_screen.dart
          lib/features/auth/employee_profile_onboarding_screen.dart
          test/auth_screens_test.dart
          test/profile_onboarding_contract_test.dart
          test/supabase_auth_service_test.dart

      - name: Run Flutter Auth tests
        run: >-
          flutter test
          test/supabase_auth_service_contract_test.dart
          test/supabase_auth_service_test.dart
          test/management_shell_contract_test.dart
          test/managed_dataset_upload_contract_test.dart
          test/profile_onboarding_contract_test.dart

      - name: Build Flutter web
        run: >-
          flutter build web --release
          --no-wasm-dry-run
