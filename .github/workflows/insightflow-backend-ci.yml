name: InsightFlow Backend CI

on:
  push:
    branches: [main, feature/data-workspace, feature/employee-management-cell, fix/protected-original-upload-grant-20261025]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  authorization-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: insightflow_authz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insightflow_authz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/insightflow_authz_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile migration runner and integration tests
        run: python -m py_compile tools/run_authz_migrations.py tests/test_authz_assignment_index_verification.py tests/test_authz_assignment_index_postgres.py
      - name: Run assignment index unit tests
        run: pytest -q tests/test_authz_assignment_index_verification.py
      - name: Run disposable PostgreSQL migration integration tests
        run: pytest -q -rs tests/test_authz_assignment_index_postgres.py

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Python static analysis on dataset authorization changes
        run: |
          python -m pip install ruff
          ruff check --select E4,E7,E9,F dataset_storage/manager_grants.py dataset_storage/proposals.py dataset_storage/routes.py tests/test_dataset_proposals.py tests/test_active_assignment_authorization_contract.py tests/integration/test_postgres_manager_grant_races.py tools/run_authz_migrations.py

      - name: Verify authorization migration runner
        run: |
          python -m py_compile tools/run_authz_migrations.py
          python tools/run_authz_migrations.py --help >/dev/null

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase emulator test dependencies
        run: npm install

      - name: Run RTDB/Auth emulator security tests
        run: npm run test:rules

      - name: Run Firebase authorization unit tests
        run: pytest -q tests/test_firebase_authz.py tests/test_firebase_authz_api.py tests/test_office_mutation_boundary.py

      - name: Run Data Workspace focused tests
        run: pytest -q tests/test_data_workspace_foundation.py tests/test_data_workspace_semantics.py

      - name: Run managed dataset ingestion and storage tests
        run: pytest -q tests/test_managed_dataset_storage.py tests/test_managed_dataset_structured_storage.py

      - name: Run backend regression suite
        run: pytest -q

      - name: Run context-state acceptance unit tests
        run: pytest -q tests/test_assistant_identity.py tests/test_conversation_state.py

  flutter-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_detail_source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Firebase Auth Flutter sources
        run: >-
          dart analyze
          lib/firebase_options.dart
          lib/core/auth/insightflow_auth_service.dart
          lib/core/auth/authenticated_http.dart

      - name: Check auth UI Dart formatting
        run: >-
          dart format
          --output=none
          lib/features/auth/auth_glass_widgets.dart
          lib/features/auth/sign_in_screen.dart
          lib/features/auth/sign_up_screen.dart
          lib/features/auth/auth_gate.dart
          lib/features/auth/employee_invitation_password_setup_screen.dart
          lib/features/auth/organization_onboarding_screen.dart
          lib/features/auth/account_management_screen.dart
          lib/features/auth/authorization_management_screen.dart
          lib/features/auth/management_shell.dart
          lib/features/auth/management_navigation.dart
          lib/features/auth/managed_dataset_access_workspace.dart
          lib/core/auth/insightflow_auth_service.dart
          lib/core/auth/authenticated_http.dart
          lib/core/interop/excel_mutation_authorization.dart
          test/auth_screens_test.dart

      - name: Analyze auth UI Flutter sources
        run: >-
          flutter analyze
          lib/features/auth/auth_glass_widgets.dart
          lib/features/auth/sign_in_screen.dart
          lib/features/auth/sign_up_screen.dart
          lib/features/auth/auth_gate.dart
          lib/features/auth/employee_invitation_password_setup_screen.dart
          lib/features/auth/organization_onboarding_screen.dart
          lib/features/auth/account_management_screen.dart
          lib/features/auth/authorization_management_screen.dart
          lib/features/auth/management_shell.dart
          lib/core/auth/insightflow_auth_service.dart
          lib/core/auth/authenticated_http.dart
          lib/core/interop/excel_mutation_authorization.dart
          test/auth_screens_test.dart

      - name: Run Flutter Auth tests
        run: >-
          flutter test
          test/firebase_auth_service_test.dart
          test/management_shell_contract_test.dart
          test/managed_dataset_upload_contract_test.dart

      - name: Build Flutter web
        run: >-
          flutter build web --release
          --no-wasm-dry-run
          --dart-define=INSIGHTFLOW_FIREBASE_WEB_API_KEY=ci-placeholder
          --dart-define=INSIGHTFLOW_FIREBASE_WEB_APP_ID=ci-placeholder
          --dart-define=INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID=ci-placeholder
          --dart-define=INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID=insightflow-5a23d
          --dart-define=INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN=ci-placeholder.firebaseapp.com
