name: InsightFlow Admin Portal CI
on:
  pull_request:
    paths: ["apps/admin_portal/**", "firebase_authz/admin_diagnostics.py", "tests/test_admin_diagnostics_contract.py", "tests/test_authz_assignment_index_postgres.py", "migrations/0042_diagnostic_admin.sql", "main.py", "tools/run_authz_migrations.py"]
  push:
    branches: [main, codex/user-diagnostics-admin-panel]
    paths: ["apps/admin_portal/**", "firebase_authz/admin_diagnostics.py", "tests/test_admin_diagnostics_contract.py", "tests/test_authz_assignment_index_postgres.py", "migrations/0042_diagnostic_admin.sql", "main.py", "tools/run_authz_migrations.py"]
permissions: {contents: read}
jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: insightflow_authz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d insightflow_authz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTHZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/insightflow_authz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests/test_admin_diagnostics_contract.py tests/test_management_ui_policy_contract.py tests/test_provider_diagnostics.py tests/test_firebase_authz_api.py
      - run: >-
          python -m pytest -q
          tests/test_authz_assignment_index_postgres.py::test_diagnostic_session_claim_and_scope_isolation_on_disposable_postgres
          tests/test_authz_assignment_index_postgres.py::test_diagnostic_route_functions_use_disposable_postgres_for_claim_and_events
          tests/test_authz_assignment_index_postgres.py::test_diagnostic_http_endpoints_use_disposable_postgres
          tests/test_authz_assignment_index_postgres.py::test_diagnostic_http_claim_is_single_winner_under_concurrency
      - run: python -m pip install ruff
      - run: ruff check --select E4,E7,E9,F --ignore E701,E702 firebase_authz/admin_diagnostics.py tests/test_admin_diagnostics_contract.py
      - run: python -m py_compile firebase_authz/admin_diagnostics.py tools/run_authz_migrations.py
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install --ignore-scripts
        working-directory: apps/admin_portal
      - run: npm run build
        working-directory: apps/admin_portal
