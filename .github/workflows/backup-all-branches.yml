name: Backup All Branches

on:
  push:
    branches:
      - backup/all-branches-20261006

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive every branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf all-branches-backup
          mkdir -p all-branches-backup/branches

          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          printf 'branch,commit_sha\n' > all-branches-backup/manifest.csv

          while IFS= read -r ref; do
            branch="${ref#origin/}"
            safe="$(printf '%s' "$branch" | sed 's#[/]#__#g')"
            mkdir -p "all-branches-backup/branches/$safe"

            git archive "$ref" | tar -x -C "all-branches-backup/branches/$safe"
            sha="$(git rev-parse "$ref")"
            printf '"%s",%s\n' "$branch" "$sha" >> all-branches-backup/manifest.csv
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/heads | sort)

          {
            echo "InsightFlow / PritishMete/data_analysis"
            echo "Complete branch snapshot backup generated from GitHub."
            echo
            echo "Each branch has its own directory under branches/."
            echo "manifest.csv maps every branch to the exact commit SHA."
            echo
            echo "Generated by GitHub Actions."
          } > all-branches-backup/README.txt

          cd all-branches-backup
          zip -qr ../InsightFlow_all_branches_2026-10-06.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsightFlow-all-branches-2026-10-06
          path: InsightFlow_all_branches_2026-10-06.zip
          if-no-files-found: error
