name: Build InsightFlow Flutter web for Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter_app/**'
      - 'docs/EXCEL_AUTHENTICATION.md'
      - '.github/workflows/flutter-web-pages.yml'
  workflow_dispatch:
    inputs:
      diagnostic_build:
        description: 'Enable temporary Excel diagnostics (requires explicit approval)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # Normal and diagnostic builds share one lock so they cannot race while
  # updating the gh-pages source branch consumed by Cloudflare Pages.
  group: insightflow-flutter-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Set up Node for Excel auth bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Excel authentication bridge
        working-directory: apps/flutter_app
        run: node test/excel_auth_bridge_test.js

      - name: Run auth and onboarding regression tests
        working-directory: apps/flutter_app
        run: flutter test test/onboarding_auth_flow_contract_test.dart test/auth_gate_management_landing_test.dart test/management_navigation_context_test.dart test/management_shell_contract_test.dart test/google_oauth_entrypoint_test.dart test/main_auth_gate_entrypoint_test.dart

      - name: Analyze changed auth and onboarding files
        working-directory: apps/flutter_app
        run: flutter analyze --no-fatal-infos lib/core/auth/authenticated_http.dart lib/core/auth/supabase_auth_service.dart lib/features/auth/auth_gate.dart lib/features/auth/excel_auth_gate.dart lib/core/interop/excel_auth_bridge.dart lib/core/interop/excel_auth_bridge_web.dart lib/features/auth/sign_in_screen.dart lib/features/auth/employee_profile_onboarding_screen.dart test/onboarding_auth_flow_contract_test.dart test/google_oauth_entrypoint_test.dart

      - name: Validate production web build configuration
        shell: bash
        env:
          INSIGHTFLOW_FIREBASE_WEB_API_KEY: ${{ secrets.INSIGHTFLOW_FIREBASE_WEB_API_KEY }}
          INSIGHTFLOW_FIREBASE_WEB_APP_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_APP_ID }}
          INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID: insightflow-5a23d
          INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN }}
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
          INSIGHTFLOW_SUPABASE_URL: ${{ secrets.INSIGHTFLOW_SUPABASE_URL }}
          INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY }}
          INSIGHTFLOW_BACKEND_URL: ${{ vars.INSIGHTFLOW_BACKEND_URL }}
          INSIGHTFLOW_EXCEL_AUTH_DIAGNOSTICS: ${{ inputs.diagnostic_build || 'false' }}
        run: |
          set -euo pipefail
          required=(
            INSIGHTFLOW_FIREBASE_WEB_API_KEY
            INSIGHTFLOW_FIREBASE_WEB_APP_ID
            INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID
            INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID
            INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN
            INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID
            INSIGHTFLOW_SUPABASE_URL
            INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY
            INSIGHTFLOW_BACKEND_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required build configuration: ${name}"
              exit 1
            fi
          done
          test "${INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID}" = "insightflow-5a23d"

      - name: Build Flutter web
        working-directory: apps/flutter_app
        env:
          INSIGHTFLOW_FIREBASE_WEB_API_KEY: ${{ secrets.INSIGHTFLOW_FIREBASE_WEB_API_KEY }}
          INSIGHTFLOW_FIREBASE_WEB_APP_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_APP_ID }}
          INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID: insightflow-5a23d
          INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN }}
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
          INSIGHTFLOW_WORKSPACE_ID: ${{ vars.INSIGHTFLOW_WORKSPACE_ID }}
          INSIGHTFLOW_SUPABASE_URL: ${{ secrets.INSIGHTFLOW_SUPABASE_URL }}
          INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY }}
          INSIGHTFLOW_BACKEND_URL: ${{ vars.INSIGHTFLOW_BACKEND_URL }}
        run: |
          set -euo pipefail
          clean_env() { printf '%s' "${!1:-}" | tr -d '\r\n'; }
          build_args=(
            # Cloudflare Pages serves the site at the domain root. A root base
            # href keeps the generated Flutter bundle working on both the
            # Cloudflare Pages project and any root-mounted static host.
            build web --release --no-wasm-dry-run --base-href "/"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_API_KEY=$(clean_env INSIGHTFLOW_FIREBASE_WEB_API_KEY)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_APP_ID=$(clean_env INSIGHTFLOW_FIREBASE_WEB_APP_ID)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID=$(clean_env INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID=$(clean_env INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN=$(clean_env INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN)"
            --dart-define "INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID=$(clean_env INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID)"
            --dart-define "INSIGHTFLOW_WORKSPACE_ID=$(clean_env INSIGHTFLOW_WORKSPACE_ID)"
            --dart-define "INSIGHTFLOW_SUPABASE_URL=$(clean_env INSIGHTFLOW_SUPABASE_URL)"
            --dart-define "INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY=$(clean_env INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY)"
            --dart-define "INSIGHTFLOW_BACKEND_URL=$(clean_env INSIGHTFLOW_BACKEND_URL)"
          )
          diagnostic_build="${INSIGHTFLOW_EXCEL_AUTH_DIAGNOSTICS:-false}"
          if [ "${diagnostic_build}" = "true" ]; then
            build_args+=(--dart-define "INSIGHTFLOW_EXCEL_AUTH_DIAGNOSTICS=true")
          fi
          flutter "${build_args[@]}"

          if [ "${diagnostic_build}" = "true" ]; then
            grep -R -q "INSIGHTFLOW_EXCEL_AUTH_DIAGNOSTICS" build/web || {
              echo "::error::Diagnostic build requested but support marker is absent"
              exit 1
            }
          fi

      - name: Stamp generated web build identity
        working-directory: apps/flutter_app
        shell: bash
        env:
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "${INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID}"
          sed -i "s/__INSIGHTFLOW_BUILD_COMMIT__/${GITHUB_SHA}/g" build/web/index.html
          sed -i "s/__INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID__/${INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID}/g" build/web/index.html

      - name: Generate Cloudflare Pages SPA fallback
        working-directory: apps/flutter_app
        shell: bash
        run: |
          set -euo pipefail
          cp build/web/index.html build/web/404.html
          cmp -s build/web/index.html build/web/404.html

      - name: Verify generated web bundle
        working-directory: apps/flutter_app
        shell: bash
        env:
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          assert_file() {
            local label="$1" file="$2"
            if test -f "$file"; then echo "PASS: ${label} (${file})"; else echo "FAIL: ${label} (${file} missing)"; exit 1; fi
          }
          assert_text() {
            local label="$1" expected="$2" file="$3"
            if grep -Fq -- "$expected" "$file"; then
              echo "PASS: ${label} (${file})"
            else
              echo "FAIL: ${label} (${file}); expected literal: ${expected}"
              echo "Observed diagnostic (matching lines, if any):"
              grep -FnE 'build|Google|profile|membership|authz' "$file" | head -n 20 || true
              exit 1
            fi
          }
          assert_file "generated index" build/web/index.html
          assert_file "Cloudflare Pages SPA fallback" build/web/404.html
          assert_file "Flutter bootstrap" build/web/flutter_bootstrap.js
          assert_file "compiled Dart bundle" build/web/main.dart.js
          assert_text "exact source commit marker" "${GITHUB_SHA}" build/web/index.html
          assert_text "SPA fallback source commit marker" "${GITHUB_SHA}" build/web/404.html
          cmp -s build/web/index.html build/web/404.html
          assert_text "configured Google OAuth client ID" "$INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID" build/web/index.html
          if grep -Fq -- "__INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID__" build/web/index.html; then
            echo "FAIL: Google OAuth client ID placeholder remains in index.html"
            exit 1
          fi
          assert_text "profile completion auth marker" "profile_complete" build/web/main.dart.js
          assert_text "membership status auth marker" "membership_status" build/web/main.dart.js
          assert_text "authorization API integration" "/v1/authz/me" build/web/main.dart.js

      - name: Checkout Cloudflare Pages source branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-publish
          fetch-depth: 1

      - name: Replace Flutter web bundle only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gh-pages-publish/assets
          rm -rf gh-pages-publish/canvaskit
          rm -f gh-pages-publish/flutter.js
          rm -f gh-pages-publish/flutter_bootstrap.js
          rm -f gh-pages-publish/flutter_service_worker.js
          rm -f gh-pages-publish/main.dart.js
          rm -f gh-pages-publish/index.html
          rm -f gh-pages-publish/404.html
          rm -f gh-pages-publish/version.json
          cp -R apps/flutter_app/build/web/. gh-pages-publish/

      - name: Verify Cloudflare source build identity
        shell: bash
        env:
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -f gh-pages-publish/flutter_bootstrap.js
          test -f gh-pages-publish/main.dart.js
          test -f gh-pages-publish/404.html
          grep -q "${GITHUB_SHA}" gh-pages-publish/index.html
          grep -q "${GITHUB_SHA}" gh-pages-publish/404.html
          grep -Fq "$INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID" gh-pages-publish/index.html
          ! grep -Fq "__INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID__" gh-pages-publish/index.html
          grep -R -q "profile_complete" gh-pages-publish
          grep -R -q "membership_status" gh-pages-publish

      - name: Publish Cloudflare Pages source branch
        working-directory: gh-pages-publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No published Flutter changes."
            exit 0
          fi
          git commit -m "deploy: publish onboarding fix from ${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            if git push origin gh-pages; then
              exit 0
            fi
            echo "gh-pages push failed (attempt ${attempt}); retrying..." >&2
            sleep 5
          done
          exit 1
