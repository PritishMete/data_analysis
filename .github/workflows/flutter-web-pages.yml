name: Build and publish InsightFlow Flutter web

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/flutter-web-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: insightflow-flutter-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Run auth and onboarding regression tests
        working-directory: apps/flutter_app
        run: flutter test test/onboarding_auth_flow_contract_test.dart test/auth_gate_management_landing_test.dart test/management_navigation_context_test.dart test/management_shell_contract_test.dart test/google_oauth_entrypoint_test.dart

      - name: Analyze changed auth and onboarding files
        working-directory: apps/flutter_app
        run: flutter analyze --no-fatal-infos lib/core/auth/authenticated_http.dart lib/core/auth/supabase_auth_service.dart lib/features/auth/auth_gate.dart lib/features/auth/sign_in_screen.dart lib/features/auth/employee_profile_onboarding_screen.dart test/onboarding_auth_flow_contract_test.dart test/google_oauth_entrypoint_test.dart

      - name: Stamp production web build identity
        working-directory: apps/flutter_app
        shell: bash
        env:
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "${INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID}"
          sed -i "s/__INSIGHTFLOW_BUILD_COMMIT__/${GITHUB_SHA}/g" web/index.html
          sed -i "s/__INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID__/${INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID}/g" web/index.html

      - name: Validate production web build configuration
        shell: bash
        env:
          INSIGHTFLOW_FIREBASE_WEB_API_KEY: ${{ secrets.INSIGHTFLOW_FIREBASE_WEB_API_KEY }}
          INSIGHTFLOW_FIREBASE_WEB_APP_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_APP_ID }}
          INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID: insightflow-5a23d
          INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN }}
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
          INSIGHTFLOW_SUPABASE_URL: ${{ secrets.INSIGHTFLOW_SUPABASE_URL }}
          INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY }}
          INSIGHTFLOW_BACKEND_URL: https://data-analysis-oajs.onrender.com
        run: |
          set -euo pipefail
          required=(
            INSIGHTFLOW_FIREBASE_WEB_API_KEY
            INSIGHTFLOW_FIREBASE_WEB_APP_ID
            INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID
            INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID
            INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN
            INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID
            INSIGHTFLOW_SUPABASE_URL
            INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required build configuration: ${name}"
              exit 1
            fi
          done
          test "${INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID}" = "insightflow-5a23d"

      - name: Build Flutter web
        working-directory: apps/flutter_app
        env:
          INSIGHTFLOW_FIREBASE_WEB_API_KEY: ${{ secrets.INSIGHTFLOW_FIREBASE_WEB_API_KEY }}
          INSIGHTFLOW_FIREBASE_WEB_APP_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_APP_ID }}
          INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID }}
          INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID: insightflow-5a23d
          INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN }}
          INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID: ${{ vars.INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID }}
          INSIGHTFLOW_WORKSPACE_ID: ${{ vars.INSIGHTFLOW_WORKSPACE_ID }}
          INSIGHTFLOW_SUPABASE_URL: ${{ secrets.INSIGHTFLOW_SUPABASE_URL }}
          INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY }}
          INSIGHTFLOW_BACKEND_URL: https://data-analysis-oajs.onrender.com
        run: |
          set -euo pipefail
          clean_env() { printf '%s' "${!1:-}" | tr -d '\r\n'; }
          build_args=(
            build web --release --no-wasm-dry-run --base-href "/data_analysis/"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_API_KEY=$(clean_env INSIGHTFLOW_FIREBASE_WEB_API_KEY)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_APP_ID=$(clean_env INSIGHTFLOW_FIREBASE_WEB_APP_ID)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID=$(clean_env INSIGHTFLOW_FIREBASE_WEB_MESSAGING_SENDER_ID)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID=$(clean_env INSIGHTFLOW_FIREBASE_WEB_PROJECT_ID)"
            --dart-define "INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN=$(clean_env INSIGHTFLOW_FIREBASE_WEB_AUTH_DOMAIN)"
            --dart-define "INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID=$(clean_env INSIGHTFLOW_GOOGLE_WEB_CLIENT_ID)"
            --dart-define "INSIGHTFLOW_WORKSPACE_ID=$(clean_env INSIGHTFLOW_WORKSPACE_ID)"
            --dart-define "INSIGHTFLOW_SUPABASE_URL=$(clean_env INSIGHTFLOW_SUPABASE_URL)"
            --dart-define "INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY=$(clean_env INSIGHTFLOW_SUPABASE_PUBLISHABLE_KEY)"
            --dart-define "INSIGHTFLOW_BACKEND_URL=$(clean_env INSIGHTFLOW_BACKEND_URL)"
          )
          flutter "${build_args[@]}"

      - name: Verify generated web bundle
        working-directory: apps/flutter_app
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/main.dart.js
          grep -q "${GITHUB_SHA}" build/web/index.html
          grep -q "Continue with Google" build/web/main.dart.js
          grep -R -q "profile_complete" build/web
          grep -R -q "membership_status" build/web
          grep -R -q "/v1/authz/me" build/web

      - name: Checkout published gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-publish
          fetch-depth: 1

      - name: Replace Flutter web bundle only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gh-pages-publish/assets
          rm -rf gh-pages-publish/canvaskit
          rm -f gh-pages-publish/flutter.js
          rm -f gh-pages-publish/flutter_bootstrap.js
          rm -f gh-pages-publish/flutter_service_worker.js
          rm -f gh-pages-publish/main.dart.js
          rm -f gh-pages-publish/index.html
          rm -f gh-pages-publish/version.json
          cp -R apps/flutter_app/build/web/. gh-pages-publish/

      - name: Verify published source build identity
        shell: bash
        run: |
          set -euo pipefail
          test -f gh-pages-publish/flutter_bootstrap.js
          test -f gh-pages-publish/main.dart.js
          grep -q "${GITHUB_SHA}" gh-pages-publish/index.html
          grep -q "Continue with Google" gh-pages-publish/main.dart.js
          grep -R -q "profile_complete" gh-pages-publish
          grep -R -q "membership_status" gh-pages-publish

      - name: Commit and publish
        working-directory: gh-pages-publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No published Flutter changes."
            exit 0
          fi
          git commit -m "deploy: publish onboarding fix from ${GITHUB_SHA}"
          git push origin gh-pages


      - name: Upload complete GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-publish

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Google sign-in bundle
        shell: bash
        env:
          PAGES_URL: https://pritishmete.github.io/data_analysis
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            index_url="${PAGES_URL}/index.html?verify=${GITHUB_SHA}-${attempt}"
            index_html="$(curl --fail --silent --show-error --location "${index_url}")"
            if grep -q "${GITHUB_SHA}" <<<"${index_html}"; then
              bundle_path="$(grep -o 'main.dart.js?[^\"]*' <<<"${index_html}" | head -n 1)"
              if [ -n "${bundle_path}" ]; then
                bundle_js="$(curl --fail --silent --show-error --location "${PAGES_URL}/${bundle_path}")"
                if grep -q "Continue with Google" <<<"${bundle_js}"; then
                  echo "Live Pages bundle verified for ${GITHUB_SHA}."
                  exit 0
                fi
              fi
            fi
            echo "Waiting for live Pages deployment (attempt ${attempt}/18)."
            sleep 10
          done
          echo "::error::Live Pages did not expose the expected build SHA and Google sign-in entry point."
          exit 1
