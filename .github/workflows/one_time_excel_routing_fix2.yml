name: One-time Excel routing fix 2

on:
  push:
    branches: [feature/data-workspace]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/data-workspace

      - name: Apply focused source fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          screen = Path('flutter_detail_source/lib/features/dashboard/data_screen.dart')
          text = screen.read_text(encoding='utf-8')
          if 'Future<bool> _tryExecuteSecureExcelLocalQuery' not in text:
              anchor = '  Future<bool> _tryExecuteLocalNaturalFilterQuery(String query) async {'
              helper = '''  // Secure grouped-count and quality requests are claimed before the generic\n  // filter planner. This prevents grouped wording such as "in each city" from\n  // being interpreted as a row filter on a nonexistent `name` column.\n  Future<bool> _tryExecuteSecureExcelLocalQuery(String query) async {\n    if (!secureLocalOnly || !SecureExcelLocalService.supportsQuery(query)) {\n      return false;\n    }\n    await _executeSmartQuery(query);\n    return true;\n  }\n\n'''
              if anchor not in text:
                  raise SystemExit('routing anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''    // Gemini is the primary natural-language planner. It receives only the\n    // user query + detected column names; the workbook rows stay local. The\n    // returned structured predicates are validated and executed locally.\n    final bool localFilterHandled = await _tryExecuteLocalNaturalFilterQuery(\n      query,\n    );\n'''
          new = '''    // Secure worksheet analytics must win over generic filter interpretation.\n    final bool localSecureHandled = await _tryExecuteSecureExcelLocalQuery(query);\n    if (localSecureHandled) return;\n\n    // Gemini is the primary natural-language planner. It receives only the\n    // user query + detected column names; the workbook rows stay local. The\n    // returned structured predicates are validated and executed locally.\n    final bool localFilterHandled = await _tryExecuteLocalNaturalFilterQuery(\n      query,\n    );\n'''
          if old not in text:
              raise SystemExit('processChatQuery routing block not found')
          text = text.replace(old, new, 1)

          old_group = '''        if (action == 'group') {\n          final columns = operation['columns'] is List\n              ? List<dynamic>.from(operation['columns'])\n              : <dynamic>[];\n          final resultRows = operation['rows'] is List\n              ? List<dynamic>.from(operation['rows'])\n              : <dynamic>[];\n          final tableText = _formatSqlResultAsText(columns, resultRows);\n          setState(() {\n            isSearchingChat = false;\n            chatHistory.add({\n              "sender": "system",\n              "text": "${localResult['message'] ?? 'Here is what I found:'}\\n\\n$tableText",\n            });\n          });\n'''
          new_group = '''        if (action == 'group') {\n          final columns = operation['columns'] is List\n              ? List<dynamic>.from(operation['columns'])\n              : <dynamic>[];\n          final resultRows = operation['rows'] is List\n              ? List<dynamic>.from(operation['rows'])\n              : <dynamic>[];\n          final tableText = _formatSqlResultAsText(columns, resultRows);\n          String sheetNote = "";\n          try {\n            final agentName = await suggestAgenticSheetName(\n              query: userText,\n              operation: "query_result",\n              context: {\n                "result_columns": columns.map((e) => e.toString()).toList(),\n              },\n            );\n            final sheetName = _sanitizeSheetName(\n              agentName ??\n                  _queryDerivedSheetName(userText, fallback: "Query_Result"),\n            );\n            final writeResult = await writeQueryResultToSheet(\n              json.encode({\n                "targetSheetName": sheetName,\n                "columns": columns,\n                "rows": resultRows,\n              }),\n            );\n            if (writeResult["success"] == true) {\n              sheetNote = "\\n\\n📄 Created and switched to sheet '$sheetName'.";\n              await refreshWorksheetNames();\n              await syncHeadersSilently();\n            } else {\n              sheetNote =\n                  "\\n\\n⚠️ Could not write results to a sheet: ${writeResult['error'] ?? 'unknown error'}";\n            }\n          } catch (e) {\n            sheetNote = "\\n\\n⚠️ Could not write results to a sheet: $e";\n          }\n          setState(() {\n            isSearchingChat = false;\n            chatHistory.add({\n              "sender": "system",\n              "text": "${localResult['message'] ?? 'Here is what I found:'}\\n\\n$tableText$sheetNote",\n            });\n          });\n'''
          if old_group not in text:
              raise SystemExit('group rendering block not found')
          text = text.replace(old_group, new_group, 1)
          screen.write_text(text, encoding='utf-8')

          service = Path('flutter_detail_source/lib/core/services/secure_excel_local_service_web.dart')
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              "final hasDuplicate = RegExp(r'\\b(?:duplicate|duplicates|duplicated)\\b').hasMatch(lower);\n    if (hasCheckVerb && hasMissing && hasDuplicate) return true;",
              "final hasDuplicate = RegExp(r'\\b(?:duplicate|duplicates|duplicated)\\b').hasMatch(lower);\n    final hasIdentifierReference = RegExp(r'\\b(?:restaurant\\s*ids?|restaurant[_ ]?identifier|duplicates?\\s+[a-z0-9_]+\\s+(?:values?|ids?))\\b').hasMatch(lower);\n    if (hasCheckVerb && (hasMissing || hasDuplicate) && (hasMissing || hasIdentifierReference)) return true;",
              1,
          )
          service.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('flutter_detail_source/web/excel_secure_query.js')
          text = p.read_text(encoding='utf-8')

          old_intent = '''function _secureLooksLikeQuality(query) {\n    const q = _secureNormalize(query);\n    return /\\b(check|inspect|find|show|report|identify)\\b/.test(q)\n        && /\\b(missing|null|blank|empty)\\b/.test(q)\n        && /\\b(duplicate|duplicates|duplicated)\\b/.test(q);\n}\n'''
          new_intent = '''function _secureLooksLikeQuality(query) {\n    const q = _secureNormalize(query);\n    const verb = /\\b(check|inspect|find|show|report|identify)\\b/.test(q);\n    const missing = /\\b(missing|null|blank|empty)\\b/.test(q);\n    const duplicate = /\\b(duplicate|duplicates|duplicated)\\b/.test(q);\n    const identifier = /\\brestaurant ?ids?\\b/.test(q) ||\n        /\\bduplicates? [a-z0-9_]+ (values?|ids?)\\b/.test(q);\n    return verb && (missing || duplicate) && (missing || identifier);\n}\n'''
          if old_intent not in text:
              raise SystemExit('JS quality intent block not found')
          text = text.replace(old_intent, new_intent, 1)

          old_identifier = '''function _secureInferIdentifierColumn(headers, query) {\n    const q = _secureNormalize(query);\n    if (/\\brestaurant\\s+ids?\\b/.test(q)) {\n        return _secureResolveColumn(headers, "restaurant id");\n    }\n    const candidates = headers.map((h, i) => ({ i, n: _secureNormalize(h) }))\n        .filter(x => /(^| )(restaurant )?(id|identifier)( |$)/.test(x.n));\n    return candidates.length === 1 ? candidates[0].i : -1;\n}\n'''
          new_identifier = '''function _secureIdentifierCandidates(headers, requested) {\n    const wanted = _secureNormalize(requested);\n    if (!wanted) return [];\n    return headers.map((h, i) => ({ i, name: String(h ?? "").trim(), n: _secureNormalize(h) }))\n        .filter(x => x.name && x.n === wanted);\n}\n\nfunction _secureInferIdentifierColumn(headers, query) {\n    const q = _secureNormalize(query);\n    const explicit = q.match(/\\b(?:restaurant ?ids?|restaurant ?identifier)\\b/);\n    if (explicit) {\n        const requested = explicit[0];\n        const candidates = _secureIdentifierCandidates(headers, requested);\n        return { index: candidates.length === 1 ? candidates[0].i : -1, requested, candidates };\n    }\n    const named = q.match(/\\bduplicates?\\s+(?:the\\s+)?([a-z0-9_]+(?:\\s+[a-z0-9_]+)?)\\s+(?:values?|ids?)\\b/);\n    if (named) {\n        const requested = named[1].trim();\n        const candidates = _secureIdentifierCandidates(headers, requested);\n        return { index: candidates.length === 1 ? candidates[0].i : -1, requested, candidates };\n    }\n    const candidates = headers.map((h, i) => ({ i, name: String(h ?? "").trim(), n: _secureNormalize(h) }))\n        .filter(x => /(^| )(restaurant )?(id|identifier)( |$)/.test(x.n));\n    return { index: candidates.length === 1 ? candidates[0].i : -1, requested: null, candidates };\n}\n'''
          if old_identifier not in text:
              raise SystemExit('JS identifier resolver block not found')
          text = text.replace(old_identifier, new_identifier, 1)

          old_quality = '''    const idIndex = _secureInferIdentifierColumn(headers, query);\n    let duplicateIdentifier = {\n        status: "identifier_not_selected",\n        message: "No unique identifier column was found for duplicate-ID analysis.",\n        column: null,\n        duplicate_value_count: 0,\n        duplicate_row_count: 0,\n        values: [],\n    };\n    if (idIndex >= 0) {\n        const counts = new Map();\n        for (const row of rows) {\n            const value = row[idIndex];\n            if (_secureMissing(value)) continue;\n            const key = `${typeof value}:${String(value).trim()}`;\n            const existing = counts.get(key);\n            if (existing) existing.count++;\n            else counts.set(key, { value: typeof value === "string" ? value.trim() : value, count: 1 });\n        }\n        const duplicates = Array.from(counts.values()).filter(x => x.count > 1);\n        duplicateIdentifier = {\n            status: "ok",\n            column: String(headers[idIndex]),\n            duplicate_value_count: duplicates.length,\n            duplicate_row_count: duplicates.reduce((sum, x) => sum + x.count, 0),\n            values: duplicates.map(x => x.value),\n        };\n    }\n'''
          new_quality = '''    const idResolution = _secureInferIdentifierColumn(headers, query);\n    let duplicateIdentifier = {\n        status: "identifier_not_selected",\n        message: "No unique identifier column was found for duplicate-ID analysis.",\n        requested_column: idResolution.requested,\n        candidates: idResolution.candidates.map(x => x.name),\n        column: null,\n        duplicate_value_count: 0,\n        duplicate_row_count: 0,\n        values: [],\n    };\n    if (idResolution.index < 0) {\n        if (idResolution.requested) {\n            duplicateIdentifier.status = idResolution.candidates.length > 1 ? "ambiguous_identifier" : "identifier_not_found";\n            duplicateIdentifier.message = idResolution.candidates.length > 1\n                ? `Requested identifier "${idResolution.requested}" is ambiguous; candidates: ${idResolution.candidates.map(x => x.name).join(", ")}.`\n                : `Could not resolve requested identifier column "${idResolution.requested}" from the current worksheet.`;\n        } else if (idResolution.candidates.length > 1) {\n            duplicateIdentifier.status = "ambiguous_identifier";\n            duplicateIdentifier.message = `Multiple identifier candidates found: ${idResolution.candidates.map(x => x.name).join(", ")}.`;\n        }\n    } else {\n        const idIndex = idResolution.index;\n        const counts = new Map();\n        for (const row of rows) {\n            const value = row[idIndex];\n            if (_secureMissing(value)) continue;\n            const key = `${typeof value}:${String(value).trim()}`;\n            const existing = counts.get(key);\n            if (existing) existing.count++;\n            else counts.set(key, { value: typeof value === "string" ? value.trim() : value, count: 1 });\n        }\n        const duplicates = Array.from(counts.values()).filter(x => x.count > 1);\n        duplicateIdentifier = {\n            status: "ok",\n            requested_column: idResolution.requested,\n            candidates: idResolution.candidates.map(x => x.name),\n            column: String(headers[idIndex]),\n            duplicate_value_count: duplicates.length,\n            duplicate_row_count: duplicates.reduce((sum, x) => sum + x.count, 0),\n            values: duplicates.map(x => x.value),\n        };\n    }\n'''
          if old_quality not in text:
              raise SystemExit('JS quality resolver block not found')
          text = text.replace(old_quality, new_quality, 1)

          old_group = '''            group_by: [headers[index]],\n            rows: resultRows,\n            row_count: resultRows.length,\n'''
          new_group = '''            group_by: [headers[index]],\n            columns: [headers[index], "count"],\n            rows: resultRows,\n            row_count: resultRows.length,\n'''
          if old_group not in text:
              raise SystemExit('JS group result shape not found')
          text = text.replace(old_group, new_group, 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat > flutter_detail_source/test/excel_secure_query_test.js <<'JS'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const assert = require('assert');

          const source = fs.readFileSync(path.join(__dirname, '..', 'web', 'excel_secure_query.js'), 'utf8');
          const context = { window: {}, console };
          vm.createContext(context);
          vm.runInContext(source, context);

          async function execute(rows, query) {
            return JSON.parse(await context.window.executeSecureExcelQuery(JSON.stringify({ rows, query })));
          }

          async function run() {
            const rows = [
              ['Restaurant ID', 'Restaurant Name', 'City', 'Aggregate rating'],
              [101, 'A', 'Delhi', 4.5],
              [102, 'B', 'Mumbai', 3.2],
              [102, 'C', 'Delhi', 4.1],
              [103, 'D', '', 4.8],
              [104, 'E', null, 2.9],
            ];
            const original = JSON.parse(JSON.stringify(rows));

            const group = await execute(rows, 'Show the number of restaurants in each city');
            assert.strictEqual(group.success, true);
            assert.strictEqual(group.operation.action, 'group');
            assert.deepStrictEqual(group.operation.columns, ['City', 'count']);
            assert.deepStrictEqual(group.operation.rows, [
              { City: 'Delhi', count: 2 },
              { City: 'Mumbai', count: 1 },
              { City: null, count: 2 },
            ]);
            assert.ok(!JSON.stringify(group).includes('filter_rows'));
            assert.strictEqual(group.source_mutated, false);

            const groupedVariation = await execute(rows, 'Count restaurants by city');
            assert.strictEqual(groupedVariation.operation.action, 'group');
            assert.strictEqual(groupedVariation.operation.rows[0].City, 'Delhi');

            const quality = await execute(rows, 'Check for missing values and duplicate restaurant IDs');
            assert.strictEqual(quality.operation.action, 'quality_check');
            assert.strictEqual(quality.operation.missing_by_column.City, 2);
            assert.strictEqual(quality.operation.duplicate_identifier.status, 'ok');
            assert.strictEqual(quality.operation.duplicate_identifier.column, 'Restaurant ID');
            assert.deepStrictEqual(quality.operation.duplicate_identifier.values, [102]);
            assert.strictEqual(quality.operation.duplicate_identifier.duplicate_row_count, 2);

            for (const header of ['RestaurantID', 'restaurant_id', 'restaurant id']) {
              const variant = await execute([[header], [1], [1], [2]], 'Check for missing values and duplicate restaurant IDs');
              assert.strictEqual(variant.operation.duplicate_identifier.status, 'ok');
              assert.strictEqual(variant.operation.duplicate_identifier.column, header);
              assert.deepStrictEqual(variant.operation.duplicate_identifier.values, [1]);
            }

            const duplicateOnly = await execute([['RestaurantID'], [7], [7], [8]], 'Find duplicate RestaurantID values');
            assert.strictEqual(duplicateOnly.operation.action, 'quality_check');
            assert.strictEqual(duplicateOnly.operation.duplicate_identifier.column, 'RestaurantID');
            assert.deepStrictEqual(duplicateOnly.operation.duplicate_identifier.values, [7]);

            const ambiguous = await execute([['Restaurant ID', 'RestaurantID'], [1, 1], [2, 2]], 'Check for missing values and duplicate restaurant IDs');
            assert.strictEqual(ambiguous.operation.duplicate_identifier.status, 'ambiguous_identifier');
            assert.deepStrictEqual(ambiguous.operation.duplicate_identifier.candidates, ['Restaurant ID', 'RestaurantID']);

            const missingRequested = await execute([['Customer ID'], [1], [2]], 'Find duplicate RestaurantID values');
            assert.strictEqual(missingRequested.operation.duplicate_identifier.status, 'identifier_not_found');

            assert.deepStrictEqual(rows, original);

            const dartSource = fs.readFileSync(path.join(__dirname, '..', 'lib', 'features', 'dashboard', 'data_screen.dart'), 'utf8');
            const securePos = dartSource.indexOf('final bool localSecureHandled = await _tryExecuteSecureExcelLocalQuery(query);');
            const filterPos = dartSource.indexOf('final bool localFilterHandled = await _tryExecuteLocalNaturalFilterQuery(');
            assert.ok(securePos >= 0 && filterPos >= 0 && securePos < filterPos);
            assert.ok(!source.includes('fetch('));
            assert.ok(!source.includes('XMLHttpRequest'));

            console.log('excel_secure_query_test.js: all assertions passed');
          }

          run().catch(error => { console.error(error); process.exitCode = 1; });
          JS

      - name: Test, commit, push, and remove temporary workflows
        run: |
          set -euo pipefail
          node flutter_detail_source/test/excel_secure_query_test.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_detail_source/lib/features/dashboard/data_screen.dart \
            flutter_detail_source/lib/core/services/secure_excel_local_service_web.dart \
            flutter_detail_source/web/excel_secure_query.js \
            flutter_detail_source/test/excel_secure_query_test.js
          git commit -m 'Fix Excel grouped count routing and duplicate ID resolution'
          git push origin HEAD:feature/data-workspace
          git pull --ff-only origin feature/data-workspace
          git rm -f .github/workflows/one_time_excel_routing_fix.yml .github/workflows/one_time_excel_routing_fix2.yml
          git commit -m 'Remove temporary Excel routing fix workflows'
          git push origin HEAD:feature/data-workspace
