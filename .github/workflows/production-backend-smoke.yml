name: InsightFlow Production Backend Smoke

on:
  push:
    branches: [feature/data-workspace]
    paths:
      - 'main.py'
      - 'firebase_authz/**'
      - 'render.yaml'
      - '.github/workflows/production-backend-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://data-analysis-oajs.onrender.com/health
      - name: Verify registration route and CORS
        run: |
          set -euo pipefail
          echo "Production build info:"
          build_info="$(curl --fail --silent --show-error https://data-analysis-oajs.onrender.com/v1/build-info)"
          echo "$build_info"
          export BUILD_INFO="$build_info"
          export EXPECTED_SHA="${GITHUB_SHA}"
          python - <<'PY'
          import json, os
          info = json.loads(os.environ["BUILD_INFO"])
          expected = os.environ["EXPECTED_SHA"]
          actual = info.get("backend_git_sha") or info.get("backend_commit")
          if actual != expected:
              raise SystemExit(f"STALE_RENDER_BUILD: expected {expected}, got {actual}")
          PY
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --dump-header "$headers_file"             -X OPTIONS             -H 'Origin: https://pritishmete.github.io'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,content-type'             -w '%{http_code}'             https://data-analysis-oajs.onrender.com/v1/authz/organizations/register)"
          echo "OPTIONS status: $status"
          cat "$headers_file"
          echo "OPTIONS body:"
          cat "$response_file"
          post_status="$(curl --silent --show-error --output "$response_file"             -X POST             -H 'Content-Type: application/json'             -d '{"organization_name":"__smoke__"}'             -w '%{http_code}'             https://data-analysis-oajs.onrender.com/v1/authz/organizations/register)"
          echo "Unauthenticated POST status: $post_status"
          echo "POST body:"
          cat "$response_file"
          test "$status" = "200"
          test "$post_status" != "404"
          test "$post_status" = "401" || test "$post_status" = "403"

          invitation_response_file="$(mktemp)"
          invitation_headers_file="$(mktemp)"
          invitation_status="$(curl --silent --show-error --output "$invitation_response_file" --dump-header "$invitation_headers_file"             -X OPTIONS             -H 'Origin: https://pritishmete.github.io'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,content-type'             -w '%{http_code}'             https://data-analysis-oajs.onrender.com/v1/authz/invitations)"
          echo "Invitation OPTIONS status: $invitation_status"
          cat "$invitation_headers_file"
          echo "Invitation OPTIONS body:"
          cat "$invitation_response_file"
          invitation_post_status="$(curl --silent --show-error --output "$invitation_response_file"             -X POST             -H 'Content-Type: application/json'             -d '{"workspace_id":"__smoke__","email":"__smoke__@example.com","role_id":"employee"}'             -w '%{http_code}'             https://data-analysis-oajs.onrender.com/v1/authz/invitations)"
          echo "Unauthenticated invitation POST status: $invitation_post_status"
          echo "Invitation POST body:"
          cat "$invitation_response_file"
          test "$invitation_status" = "200"
          test "$invitation_post_status" = "401" || test "$invitation_post_status" = "403"

      - name: Verify organization diagnostic endpoint
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file"             -H 'Authorization: Bearer invalid-diagnostic-token'             -w '%{http_code}'             https://data-analysis-oajs.onrender.com/v1/authz/provider-diagnostics)"
          echo "Diagnostic status: $status"
          cat "$response_file"
          test "$status" = "401"
