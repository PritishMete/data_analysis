name: Flutter Detail Analysis CI

on:
  push:
    branches: [flutter-detail-analysis]
    paths:
      - 'flutter_detail_source/**'
      - '.github/workflows/flutter-detail-analysis-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter_detail_source/**'
      - '.github/workflows/flutter-detail-analysis-ci.yml'
  workflow_dispatch:

jobs:
  flutter-detail-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_detail_source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter tests
        run: flutter test

      - name: Build Detail Analysis web target
        run: flutter build web --release --target lib/detail_analysis_main.dart --base-href /ui/

      - name: Analyzer report (non-blocking existing debt)
        continue-on-error: true
        run: flutter analyze
