name: One-time Excel routing fix

on:
  push:
    branches: [feature/data-workspace]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Prepare one-time Excel routing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/data-workspace

      - name: Apply focused routing and identifier fixes
        env:
          EXPECTED_HEAD: d1ec3809e993a8ee1537a11bb42cac7255bc8691
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          screen = Path('flutter_detail_source/lib/features/dashboard/data_screen.dart')
          text = screen.read_text(encoding='utf-8')

          anchor = '''  Future<bool> _tryExecuteLocalNaturalFilterQuery(String query) async {\n'''
          helper = '''  // Secure grouped-count and quality requests must be claimed before the\n  // generic natural-language filter planner. The filter planner can otherwise\n  // interpret "number of restaurants in each city" as an entity filter and\n  // synthesize a nonexistent `name` column. This helper deliberately reuses\n  // the existing SecureExcelLocalService/Office taskpane engine; it adds only\n  // the routing precedence.\n  Future<bool> _tryExecuteSecureExcelLocalQuery(String query) async {\n    if (!secureLocalOnly || !SecureExcelLocalService.supportsQuery(query)) {\n      return false;\n    }\n    await _executeSmartQuery(query);\n    return true;\n  }\n\n'''
          if helper.strip() not in text:
              if anchor not in text:
                  raise SystemExit('routing anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''    // Gemini is the primary natural-language planner. It receives only the\n    // user query + detected column names; the workbook rows stay local. The\n    // returned structured predicates are validated and executed locally.\n    final bool localFilterHandled = await _tryExecuteLocalNaturalFilterQuery(\n      query,\n    );\n'''
          new = '''    // Claim secure worksheet analytics before any generic filter interpretation.\n    // This is intentionally ahead of the filter planner because grouped-count\n    // wording such as "in each city" is not a row-filter request.\n    final bool localSecureHandled = await _tryExecuteSecureExcelLocalQuery(query);\n    if (localSecureHandled) return;\n\n    // Gemini is the primary natural-language planner. It receives only the\n    // user query + detected column names; the workbook rows stay local. The\n    // returned structured predicates are validated and executed locally.\n    final bool localFilterHandled = await _tryExecuteLocalNaturalFilterQuery(\n      query,\n    );\n'''
          if old not in text:
              raise SystemExit('processChatQuery routing block not found')
          text = text.replace(old, new, 1)

          # Make the secure grouped result use the same sheet-writing behavior\n          # as normal Smart Query SQL results, while retaining the existing chat UI.\n          old_group = '''        if (action == 'group') {\n          final columns = operation['columns'] is List\n              ? List<dynamic>.from(operation['columns'])\n              : <dynamic>[];\n          final resultRows = operation['rows'] is List\n              ? List<dynamic>.from(operation['rows'])\n              : <dynamic>[];\n          final tableText = _formatSqlResultAsText(columns, resultRows);\n          setState(() {\n            isSearchingChat = false;\n            chatHistory.add({\n              "sender": "system",\n              "text": "${localResult['message'] ?? 'Here is what I found:'}\\n\\n$tableText",\n            });\n          });\n'''
          new_group = '''        if (action == 'group') {\n          final columns = operation['columns'] is List\n              ? List<dynamic>.from(operation['columns'])\n              : <dynamic>[];\n          final resultRows = operation['rows'] is List\n              ? List<dynamic>.from(operation['rows'])\n              : <dynamic>[];\n          final tableText = _formatSqlResultAsText(columns, resultRows);\n\n          // Grouped secure queries are analytical result queries, so use the\n          // same existing plain-result worksheet writer as the SQL route.\n          String sheetNote = "";\n          try {\n            final agentName = await suggestAgenticSheetName(\n              query: userText,\n              operation: "query_result",\n              context: {\n                "result_columns": columns.map((e) => e.toString()).toList(),\n              },\n            );\n            final sheetName = _sanitizeSheetName(\n              agentName ??\n                  _queryDerivedSheetName(userText, fallback: "Query_Result"),\n            );\n            final writeResult = await writeQueryResultToSheet(\n              json.encode({\n                "targetSheetName": sheetName,\n                "columns": columns,\n                "rows": resultRows,\n              }),\n            );\n            if (writeResult["success"] == true) {\n              sheetNote = "\\n\\n📄 Created and switched to sheet '$sheetName'.";\n              await refreshWorksheetNames();\n              await syncHeadersSilently();\n            } else {\n              sheetNote =\n                  "\\n\\n⚠️ Could not write results to a sheet: ${writeResult['error'] ?? 'unknown error'}";\n            }\n          } catch (e) {\n            sheetNote = "\\n\\n⚠️ Could not write results to a sheet: $e";\n          }\n\n          setState(() {\n            isSearchingChat = false;\n            chatHistory.add({\n              "sender": "system",\n              "text": "${localResult['message'] ?? 'Here is what I found:'}\\n\\n$tableText$sheetNote",\n            });\n          });\n'''
          if old_group not in text:
              raise SystemExit('secure group rendering block not found')
          text = text.replace(old_group, new_group, 1)

          screen.write_text(text, encoding='utf-8')
          print('patched data_screen.dart')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('flutter_detail_source/web/excel_secure_query.js')
          text = p.read_text(encoding='utf-8')

          old = '''function _secureInferIdentifierColumn(headers, query) {\n    const q = _secureNormalize(query);\n    if (/\\brestaurant\\s+ids?\\b/.test(q)) {\n        return _secureResolveColumn(headers, "restaurant id");\n    }\n    const candidates = headers.map((h, i) => ({ i, n: _secureNormalize(h) }))\n        .filter(x => /(^| )(restaurant )?(id|identifier)( |$)/.test(x.n));\n    return candidates.length === 1 ? candidates[0].i : -1;\n}\n'''
          new = '''function _secureIdentifierCandidates(headers, requested) {\n    const wanted = _secureNormalize(requested);\n    if (!wanted) return [];\n    return headers.map((h, i) => ({ i, name: String(h ?? "").trim(), n: _secureNormalize(h) }))\n        .filter(x => x.name && x.n === wanted);\n}\n\nfunction _secureInferIdentifierColumn(headers, query) {\n    const q = _secureNormalize(query);\n\n    // Prefer an explicitly named identifier. This accepts both spaced and\n    // compact forms after normalization, e.g. Restaurant ID/RestaurantID and\n    // restaurant_id. The returned object preserves ambiguity information.\n    const explicit = q.match(/\\b(?:restaurant ?ids?|restaurant ?identifier)\\b/);\n    if (explicit) {\n        const requested = explicit[0];\n        const candidates = _secureIdentifierCandidates(headers, requested);\n        if (candidates.length === 1) return { index: candidates[0].i, requested, candidates };\n        return { index: -1, requested, candidates };\n    }\n\n    // Generic explicit-column form: "duplicate CustomerID values" or\n    // "duplicate customer_id". Only use it when the wording names a column\n    // immediately after duplicate/duplicates, avoiding unrelated values.\n    const named = q.match(/\\bduplicates?\\s+(?:the\\s+)?([a-z0-9_]+(?:\\s+[a-z0-9_]+)?)\\s+(?:values?|ids?)\\b/);\n    if (named) {\n        const requested = named[1].trim();\n        const candidates = _secureIdentifierCandidates(headers, requested);\n        if (candidates.length === 1) return { index: candidates[0].i, requested, candidates };\n        return { index: -1, requested, candidates };\n    }\n\n    const candidates = headers.map((h, i) => ({ i, name: String(h ?? "").trim(), n: _secureNormalize(h) }))\n        .filter(x => /(^| )(restaurant )?(id|identifier)( |$)/.test(x.n));\n    return candidates.length === 1\n        ? { index: candidates[0].i, requested: null, candidates }\n        : { index: -1, requested: null, candidates };\n}\n'''
          if old not in text:
              raise SystemExit('identifier resolver block not found')
          text = text.replace(old, new, 1)

          old_quality = '''    const idIndex = _secureInferIdentifierColumn(headers, query);\n    let duplicateIdentifier = {\n        status: "identifier_not_selected",\n        message: "No unique identifier column was found for duplicate-ID analysis.",\n        column: null,\n        duplicate_value_count: 0,\n        duplicate_row_count: 0,\n        values: [],\n    };\n    if (idIndex >= 0) {\n        const counts = new Map();\n        for (const row of rows) {\n            const value = row[idIndex];\n            if (_secureMissing(value)) continue;\n            const key = `${typeof value}:${String(value).trim()}`;\n            const existing = counts.get(key);\n            if (existing) existing.count++;\n            else counts.set(key, { value: typeof value === "string" ? value.trim() : value, count: 1 });\n        }\n        const duplicates = Array.from(counts.values()).filter(x => x.count > 1);\n        duplicateIdentifier = {\n            status: "ok",\n            column: String(headers[idIndex]),\n            duplicate_value_count: duplicates.length,\n            duplicate_row_count: duplicates.reduce((sum, x) => sum + x.count, 0),\n            values: duplicates.map(x => x.value),\n        };\n    }\n'''
          new_quality = '''    const idResolution = _secureInferIdentifierColumn(headers, query);\n    let duplicateIdentifier = {\n        status: "identifier_not_selected",\n        message: "No unique identifier column was found for duplicate-ID analysis.",\n        requested_column: idResolution.requested,\n        candidates: idResolution.candidates.map(x => x.name),\n        column: null,\n        duplicate_value_count: 0,\n        duplicate_row_count: 0,\n        values: [],\n    };\n    if (idResolution.index < 0) {\n        if (idResolution.requested) {\n            duplicateIdentifier.status = idResolution.candidates.length > 1\n                ? "ambiguous_identifier"\n                : "identifier_not_found";\n            duplicateIdentifier.message = idResolution.candidates.length > 1\n                ? `Requested identifier "${idResolution.requested}" is ambiguous; candidates: ${idResolution.candidates.map(x => x.name).join(", ")}.`\n                : `Could not resolve requested identifier column "${idResolution.requested}" from the current worksheet.`;\n        } else if (idResolution.candidates.length > 1) {\n            duplicateIdentifier.status = "ambiguous_identifier";\n            duplicateIdentifier.message = `Multiple identifier candidates found: ${idResolution.candidates.map(x => x.name).join(", ")}.`;\n        }\n    } else {\n        const idIndex = idResolution.index;\n        const counts = new Map();\n        for (const row of rows) {\n            const value = row[idIndex];\n            if (_secureMissing(value)) continue;\n            const key = `${typeof value}:${String(value).trim()}`;\n            const existing = counts.get(key);\n            if (existing) existing.count++;\n            else counts.set(key, { value: typeof value === "string" ? value.trim() : value, count: 1 });\n        }\n        const duplicates = Array.from(counts.values()).filter(x => x.count > 1);\n        duplicateIdentifier = {\n            status: "ok",\n            requested_column: idResolution.requested,\n            candidates: idResolution.candidates.map(x => x.name),\n            column: String(headers[idIndex]),\n            duplicate_value_count: duplicates.length,\n            duplicate_row_count: duplicates.reduce((sum, x) => sum + x.count, 0),\n            values: duplicates.map(x => x.value),\n        };\n    }\n'''
          if old_quality not in text:
              raise SystemExit('quality identifier block not found')
          text = text.replace(old_quality, new_quality, 1)

          old_group_return = '''            group_by: [headers[index]],\n            rows: resultRows,\n            row_count: resultRows.length,\n'''
          new_group_return = '''            group_by: [headers[index]],\n            columns: [headers[index], "count"],\n            rows: resultRows,\n            row_count: resultRows.length,\n'''
          if old_group_return not in text:
              raise SystemExit('group result shape block not found')
          text = text.replace(old_group_return, new_group_return, 1)

          # Duplicate-only checks must enter the same secure quality operation.\n          p.write_text(text, encoding='utf-8')
          print('patched excel_secure_query.js')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('flutter_detail_source/lib/core/services/secure_excel_local_service_web.dart')
          text = p.read_text(encoding='utf-8')
          old = '''    final lower = text.trim().toLowerCase();\n    final hasCheckVerb = RegExp(r'\\b(?:check|inspect|find|show|report|identify)\\b').hasMatch(lower);\n    final hasMissing = RegExp(r'\\b(?:missing|null|blank|empty)\\b').hasMatch(lower);\n    final hasDuplicate = RegExp(r'\\b(?:duplicate|duplicates|duplicated)\\b').hasMatch(lower);\n    if (hasCheckVerb && hasMissing && hasDuplicate) return true;\n    final hasCount = RegExp(r'\\b(?:count|how many|number of)\\b').hasMatch(lower);\n'''
          new = '''    final lower = text.trim().toLowerCase();\n    final hasCheckVerb = RegExp(r'\\b(?:check|inspect|find|show|report|identify)\\b').hasMatch(lower);\n    final hasMissing = RegExp(r'\\b(?:missing|null|blank|empty)\\b').hasMatch(lower);\n    final hasDuplicate = RegExp(r'\\b(?:duplicate|duplicates|duplicated)\\b').hasMatch(lower);\n    final hasIdentifierReference = RegExp(r'\\b(?:restaurant\\s*ids?|restaurant[_ ]?identifier|duplicates?\\s+[a-z0-9_]+\\s+(?:values?|ids?))\\b').hasMatch(lower);\n    if (hasCheckVerb && (hasMissing || hasDuplicate) && (hasMissing || hasIdentifierReference)) return true;\n    final hasCount = RegExp(r'\\b(?:count|how many|number of)\\b').hasMatch(lower);\n'''
          if old not in text:
              raise SystemExit('Dart supportsQuery block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('patched secure service routing')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('flutter_detail_source/web/excel_secure_query.js')
          text = p.read_text(encoding='utf-8')
          old = '''function _secureLooksLikeQuality(query) {\n    const q = _secureNormalize(query);\n    return /\\b(check|inspect|find|show|report|identify)\\b/.test(q)\n        && /\\b(missing|null|blank|empty)\\b/.test(q)\n        && /\\b(duplicate|duplicates|duplicated)\\b/.test(q);\n}\n'''
          new = '''function _secureLooksLikeQuality(query) {\n    const q = _secureNormalize(query);\n    const verb = /\\b(check|inspect|find|show|report|identify)\\b/.test(q);\n    const missing = /\\b(missing|null|blank|empty)\\b/.test(q);\n    const duplicate = /\\b(duplicate|duplicates|duplicated)\\b/.test(q);\n    const identifier = /\\brestaurant ?ids?\\b/.test(q) ||\n        /\\bduplicates? [a-z0-9_]+ (values?|ids?)\\b/.test(q);\n    return verb && (missing || duplicate) && (missing || identifier);\n}\n'''
          if old not in text:
              raise SystemExit('JS quality intent block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('patched JS quality intent')
          PY

      - name: Add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('flutter_detail_source/test/excel_secure_query_test.js')
          text = p.read_text(encoding='utf-8')
          marker = "  console.log('excel_secure_query_test.js: all assertions passed');"
          extra = r'''  // Grouped-count routing must remain a group operation, never a filter_rows plan.\n  const groupedVariation = JSON.parse(await context.window.executeSecureExcelQuery(JSON.stringify({\n    rows,\n    query: 'Count restaurants by city',\n  })));\n  assert.strictEqual(groupedVariation.success, true);\n  assert.strictEqual(groupedVariation.operation.action, 'group');\n  assert.strictEqual(groupedVariation.operation.columns[1], 'count');\n  assert.ok(!JSON.stringify(groupedVariation).includes('filter_rows'));\n\n  // Identifier spelling variations must resolve through schema normalization.\n  for (const header of ['RestaurantID', 'restaurant_id', 'restaurant id']) {\n    const variantRows = [\n      [header, 'City'],\n      [1, 'Delhi'],\n      [1, 'Mumbai'],\n      [2, 'Delhi'],\n    ];\n    const variant = JSON.parse(await context.window.executeSecureExcelQuery(JSON.stringify({\n      rows: variantRows,\n      query: 'Check for missing values and duplicate restaurant IDs',\n    })));\n    assert.strictEqual(variant.operation.duplicate_identifier.status, 'ok');\n    assert.strictEqual(variant.operation.duplicate_identifier.column, header);\n    assert.deepStrictEqual(variant.operation.duplicate_identifier.values, [1]);\n  }\n\n  // Duplicate-only wording must be handled without requiring a missing-value phrase.\n  const duplicateOnly = JSON.parse(await context.window.executeSecureExcelQuery(JSON.stringify({\n    rows: [['RestaurantID'], [7], [7], [8]],\n    query: 'Find duplicate RestaurantID values',\n  })));\n  assert.strictEqual(duplicateOnly.operation.action, 'quality_check');\n  assert.strictEqual(duplicateOnly.operation.duplicate_identifier.column, 'RestaurantID');\n  assert.deepStrictEqual(duplicateOnly.operation.duplicate_identifier.values, [7]);\n\n  // Genuine ambiguity must be reported instead of silently selecting a column.\n  const ambiguous = JSON.parse(await context.window.executeSecureExcelQuery(JSON.stringify({\n    rows: [['Restaurant ID', 'RestaurantID'], [1, 1], [2, 2]],\n    query: 'Check for missing values and duplicate restaurant IDs',\n  })));\n  assert.strictEqual(ambiguous.operation.duplicate_identifier.status, 'ambiguous_identifier');\n  assert.deepStrictEqual(ambiguous.operation.duplicate_identifier.candidates, ['Restaurant ID', 'RestaurantID']);\n\n  // Verify the actual Dart routing source claims secure grouped/quality requests before filters.\n  const dartSource = fs.readFileSync(require('path').join(__dirname, '..', 'lib', 'features', 'dashboard', 'data_screen.dart'), 'utf8');\n  const securePos = dartSource.indexOf('final bool localSecureHandled = await _tryExecuteSecureExcelLocalQuery(query);');\n  const filterPos = dartSource.indexOf('final bool localFilterHandled = await _tryExecuteLocalNaturalFilterQuery(');\n  assert.ok(securePos >= 0 && filterPos >= 0 && securePos < filterPos);\n\n'''
          # The raw string above intentionally contains literal \\n          # sequences; turn them into real newlines before insertion.\n          extra = extra.replace('\\n', '\\n')
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          p.write_text(text.replace(marker, extra + marker, 1), encoding='utf-8')
          PY

      - name: Test and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node flutter_detail_source/test/excel_secure_query_test.js
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_detail_source/lib/features/dashboard/data_screen.dart \
            flutter_detail_source/lib/core/services/secure_excel_local_service_web.dart \
            flutter_detail_source/web/excel_secure_query.js \
            flutter_detail_source/test/excel_secure_query_test.js
          git commit -m 'Fix Excel grouped count routing and duplicate ID resolution'
          git push origin HEAD:feature/data-workspace

          # Remove this one-time workflow from the same fix commit lineage without force-pushing.
          git rm .github/workflows/one_time_excel_routing_fix.yml
          git commit -m 'Remove one-time Excel routing fix workflow'
          git push origin HEAD:feature/data-workspace
