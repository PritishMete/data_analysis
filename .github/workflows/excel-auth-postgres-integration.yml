name: Excel Auth PostgreSQL Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: excel_handoff_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d excel_handoff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EXCEL_HANDOFF_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/excel_handoff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run PostgreSQL handoff integration tests
        run: pytest -q -rs tests/integration/test_excel_handoff_postgres.py

      - name: Set up Node for the Excel browser bridge
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Excel browser bridge tests
        run: node apps/flutter_app/test/excel_auth_bridge_test.js

      - name: Set up Flutter for Excel auth gate tests
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Analyze Excel auth integration sources
        working-directory: apps/flutter_app
        run: >-
          dart analyze
          lib/features/auth/excel_auth_gate.dart
          lib/features/auth/auth_gate.dart
          lib/core/interop/excel_auth_bridge.dart
          lib/core/interop/excel_auth_bridge_web.dart
          lib/core/interop/excel_auth_bridge_stub.dart
          test/excel_auth_gate_test.dart

      - name: Run Excel auth gate widget tests
        working-directory: apps/flutter_app
        run: flutter test test/excel_auth_gate_test.dart
