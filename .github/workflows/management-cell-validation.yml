name: Management Cell Validation

on:
  push:
    branches:
      - feature/employee-management-cell
  pull_request:
    branches:
      - main
      - feature/employee-management-cell
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: management-cell-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Managed dataset backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSIGHTFLOW_PRIVACY_MODE: local_only
      SECURE_EXCEL_REMOTE_AI: "false"
      DETAIL_ANALYSIS_CHAT_GEMINI_ENABLED: "false"
      DETAIL_ANALYSIS_ALLOW_METADATA_AI: "false"
      INSIGHTFLOW_AUTH_REQUIRED: "false"
      INSIGHTFLOW_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Compile dataset and authorization modules
        run: python -m compileall -q dataset_storage firebase_authz datasets
      - name: Run managed dataset storage and proposal tests
        run: |
          pytest -q \
            tests/test_managed_dataset_storage.py \
            tests/test_managed_dataset_structured_storage.py \
            tests/test_dataset_proposals.py \
            tests/test_active_assignment_authorization_contract.py \
            tests/test_managed_dataset_role_policy.py \
            tests/test_dataset_upload_scope_authorization.py \
            tests/test_management_ui_policy_contract.py \
            tests/test_management_location_update_contract.py

  flutter:
    name: Management Cell Flutter regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter_detail_source
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run focused Management Cell regression tests
        run: |
          flutter test \
            test/management_responsive_filter_contract_test.dart \
            test/management_shell_contract_test.dart \
            test/management_skeleton_responsive_test.dart \
            test/managed_dataset_file_picker_performance_test.dart \
            test/managed_dataset_upload_contract_test.dart
      - name: Build Flutter web
        run: flutter build web --release --base-href /data_analysis/
