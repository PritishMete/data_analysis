name: Excel routing fix
on:
  push:
    branches:
      - feature/data-workspace
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/one_time_excel_routing_fix.py
      - run: |
          git config user.name 'PritishMete'
          git config user.email '67995645+PritishMete@users.noreply.github.com'
          git add flutter_detail_source/lib/features/dashboard/data_screen.dart flutter_detail_source/lib/core/services/secure_excel_local_service_web.dart flutter_detail_source/web/excel_secure_query.js flutter_detail_source/test/excel_secure_query_test.js .github/workflows/excel-routing-fix.yml tools/one_time_excel_routing_fix.py
          git commit -m 'Fix Excel grouped count and duplicate ID routing'
          git push origin feature/data-workspace
