name: Apply Excel local query fix

on:
  push:
    branches: [feature/data-workspace]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'Retry Excel source patch against current branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-workspace
          fetch-depth: 2

      - name: Apply exact Excel source patch
        env:
          PATCH_B64: 
        run: |
          python - <<'PY2'
          import base64
          from pathlib import Path
          import os
          import subprocess

          patch = base64.b64decode(os.environ['PATCH_B64'])
          Path('/tmp/excel_fix.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--ignore-space-change', '--ignore-whitespace', '/tmp/excel_fix.patch'], check=True)
          subprocess.run(['git', 'apply', '--ignore-space-change', '--ignore-whitespace', '/tmp/excel_fix.patch'], check=True)
          target = Path('flutter_detail_source/lib/features/dashboard/data_screen.dart').read_text()
          assert "import '../../core/services/secure_excel_local_service.dart';" in target
          assert 'SecureExcelLocalService.supportsQuery(userText)' in target
          assert "RegExp(r'(?i)\\bout\\s+of\\b')" not in target
          assert "RegExp(r'\\bout\\s+of\\b', caseSensitive: false)" in target
          PY2

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-excel-local-query-fix.yml
          git add flutter_detail_source/lib/features/dashboard/data_screen.dart
          git commit -m "Fix Excel secure-local analytical routing"
          git push origin HEAD:feature/data-workspace
