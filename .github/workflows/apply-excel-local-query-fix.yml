name: Apply Excel local query fix

on:
  push:
    branches: [feature/data-workspace]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message == 'Apply Excel routing patch with exact source replacement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-workspace
          fetch-depth: 2

      - name: Patch existing Dart source in place
        env:
          BLOCK_B64: 
        run: |
          python - <<'PY2'
          import base64
          import os
          from pathlib import Path

          target = Path('flutter_detail_source/lib/features/dashboard/data_screen.dart')
          source = target.read_text()
          import_line = "import '../../core/services/local_pipeline_service.dart';"
          new_import = "import '../../core/services/secure_excel_local_service.dart';"
          assert new_import not in source, 'secure Excel service import already present'
          assert import_line in source, 'expected import anchor not found'
          source = source.replace(import_line, import_line + '\n' + new_import, 1)

          marker = '      if (secureLocalOnly) {\n'
          block = base64.b64decode(os.environ['BLOCK_B64']).decode('utf-8')
          assert source.count(marker) >= 1, 'secure-local remote-query guard not found'
          source = source.replace(marker, block + '\n' + marker, 1)

          assert "RegExp(r'(?i)\\bout\\s+of\\b')" not in source
          assert "RegExp(r'\\bout\\s+of\\b', caseSensitive: false)" in source
          assert source.count('SecureExcelLocalService.supportsQuery(userText)') == 1
          target.write_text(source)
          PY2

      - name: Verify and commit source fix
        run: |
          grep -q "secure_excel_local_service.dart" flutter_detail_source/lib/features/dashboard/data_screen.dart
          grep -q "SecureExcelLocalService.supportsQuery(userText)" flutter_detail_source/lib/features/dashboard/data_screen.dart
          if grep -q "RegExp(r'(?i)\\bout\\s+of\\b')" flutter_detail_source/lib/features/dashboard/data_screen.dart; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-excel-local-query-fix.yml
          git add flutter_detail_source/lib/features/dashboard/data_screen.dart
          git commit -m "Fix Excel secure-local analytical routing"
          git push origin HEAD:feature/data-workspace
