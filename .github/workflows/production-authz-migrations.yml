name: InsightFlow Production Authz Migrations

# Production migrations are deliberately manual. CI applies the full migration
# chain to a disposable PostgreSQL service; this workflow may touch production
# only after an operator explicitly dispatches it from the configured release branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insightflow-production-authz-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/feature/employee-management-cell'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy 'psycopg[binary]'

      - name: Verify authoritative production release branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/feature/employee-management-cell"

      - name: Require production PostgreSQL secret
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is not configured."
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgresql://*|postgresql+psycopg2://*|postgres://*) ;;
            *) echo "::error::DATABASE_URL is not a PostgreSQL connection URL."; exit 1 ;;
          esac

      - name: Apply and verify authz migrations
        run: python tools/run_authz_migrations.py
