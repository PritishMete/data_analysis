name: InsightFlow Production Authz Migrations

on:
  push:
    branches: [feature/data-workspace, feature/employee-management-cell]
    paths:
      - 'migrations/**'
      - 'tools/run_authz_migrations.py'
      - '.github/workflows/production-authz-migrations.yml'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary

      - name: Require production PostgreSQL secret
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is not configured."
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgresql://*|postgresql+psycopg2://*|postgres://*) ;;
            *) echo "::error::DATABASE_URL is not a PostgreSQL connection URL."; exit 1 ;;
          esac

      - name: Apply and verify authz migrations
        run: python tools/run_authz_migrations.py
