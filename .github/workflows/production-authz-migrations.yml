name: InsightFlow Production Authz Migrations

on:
  # Read-only inspection is the default. Production changes require an explicit apply selection.
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect the configured database (read-only) or apply pending migrations after approval"
        required: true
        type: choice
        options:
          - inspect
          - apply
        default: inspect

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy 'psycopg[binary]'

      - name: Require production PostgreSQL secret
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is not configured."
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgresql://*|postgresql+psycopg2://*|postgres://*) ;;
            *) echo "::error::DATABASE_URL is not a PostgreSQL connection URL."; exit 1 ;;
          esac

      - name: Inspect target and invitation schema (read-only)
        if: ${{ inputs.operation == 'inspect' }}
        run: python tools/run_authz_migrations.py --inspect

      - name: Apply and verify authz migrations
        if: ${{ inputs.operation == 'apply' }}
        run: python tools/run_authz_migrations.py
