name: PostgreSQL dataset security integration

on:
  push:
    branches: [feature/employee-management-cell]
  pull_request:
    branches: [feature/employee-management-cell]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-security-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d insightflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INSIGHTFLOW_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/insightflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL integration test dependencies
        run: python -m pip install --upgrade pip pytest "sqlalchemy>=2.0" "psycopg[binary]"
      - name: Run PostgreSQL transaction, concurrency, and grant-revocation tests
        run: python -m pytest -q tests/integration/test_postgres_manager_grant_races.py
