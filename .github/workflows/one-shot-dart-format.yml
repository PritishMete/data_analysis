name: One-shot Dart formatter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_detail_source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          dart format \
            lib/features/auth/authorization_management_screen.dart \
            lib/features/dashboard/data_screen.dart \
            lib/core/auth/authenticated_http.dart \
            lib/core/interop/excel_mutation_authorization.dart \
            test/auth_screens_test.dart
      - working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_detail_source
          git commit -m "Format authorization integration Dart sources"
          git push origin HEAD:feature/data-workspace
