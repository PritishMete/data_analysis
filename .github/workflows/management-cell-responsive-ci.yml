name: Management Cell Responsive UI CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/management-cell-responsive-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/management-cell-responsive-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests-and-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Management Cell regression tests
        run: flutter test test/management_responsive_filter_contract_test.dart test/management_shell_contract_test.dart test/management_skeleton_responsive_test.dart test/managed_dataset_file_picker_performance_test.dart

      - name: Build release web app
        run: flutter build web --release --base-href /data_analysis/
