# Cloudflare build adapter for the repository-managed insightflow-api Worker.
# The build integration copies deploy/cloudflare/insightflow-api.js to worker.js
# before invoking Wrangler. The source-of-truth VPC configuration is retained
# under deploy/cloudflare/wrangler.toml as well.
name = "insightflow-api"
main = "worker.js"
compatibility_date = "2026-11-28"
workers_dev = true

[previews]

[[vpc_networks]]
binding = "ORACLE_VPC"
tunnel_id = "42e7b5c6-9176-4ace-ba3d-eb892f212b7f"
remote = true
