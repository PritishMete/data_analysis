<script>
  function patchHistory() {
    var noop = function () {};
    var fakeHistory = {
      replaceState: noop,
      pushState: noop,
      go: noop,
      back: noop,
      forward: noop,
      length: 0,
      state: null,
      scrollRestoration: "auto",
    };
    try {
      History.prototype.replaceState = noop;
      History.prototype.pushState = noop;
    } catch (e) {}
    try {
      Object.defineProperty(window, "history", {
        get: function () { return fakeHistory; },
        configurable: true,
      });
    } catch (e) {}
  }

  patchHistory();

  var flutterStarted = false;

  function startFlutter() {
    if (flutterStarted) {
      return;
    }
    flutterStarted = true;

    patchHistory();

    // Cache-bust the Flutter bootstrap and compiled entrypoint per deployment.
    // Office task panes can retain a previous Flutter web bundle after gh-pages
    // has received a new build. CI replaces the marker with the source commit.
    var buildCommit = "dd8ea86090530356d54f1568c95c405019bcd317";
    var script = document.createElement("script");
    script.src = "flutter_bootstrap.js?build=" + buildCommit;
    script.onload = function () {
      _flutter.buildConfig = {
        builds: [
          {
            compileTarget: "dart2js",
            renderer: "canvaskit",
            mainJsPath: "main.dart.js?build=" + buildCommit,
          },
        ],
      };
    };
    document.head.appendChild(script);
  }

  // Office.js is optional for the normal browser deployment. Do not make the
  // entire Flutter application depend on Office.onReady, which may be absent
  // or fail outside an Office host. When Office is available, keep the host
  // signal and callback behavior for Excel integrations.
  if (typeof Office !== "undefined" && typeof Office.onReady === "function") {
    Office.onReady(function (info) {
      if (typeof window._onOfficeReady === "function") {
        window._onOfficeReady();
      }
      console.log("Office.onReady fired. Host:", info.host, "Platform:", info.platform);
      window.__isOfficeHost = !!(info && info.host);
      startFlutter();
    });
  }

  // Start immediately for ordinary browsers; the idempotent Office callback
  // above can still enrich the host state when Office.js becomes ready.
  startFlutter();
</script>
