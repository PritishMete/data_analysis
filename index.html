<html>

  <meta name="detail-analysis-build-id" content="48ffdb4ece8673d01e521870320d830574636781">
  <title>electric_ai_app</title>

  <!-- Office.js MUST come first -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <!-- Local worksheet engines load before Flutter. Secure query execution is
       entirely in-page and never posts workbook rows to a server. -->
  <script src="excel_data_processor.js"></script>
  <script src="excel_helper.js"></script>
  <script src="excel_schema_bridge.js"></script>
  <script src="excel_schema_intelligence.js"></script>
  <script src="excel_secure_query.js"></script>
  <script src="excel_secure_aggregation.js"></script>
  <script src="excel_native_chart.js"></script>
  <script src="excel_synthetic_data.js"></script>
  <script src="excel_quality_report_generator.js"></script>
</head>
<body>
<script>
  function patchHistory() {
    var noop = function () {};
    var fakeHistory = {
      replaceState: noop,
      pushState: noop,
      go: noop,
      back: noop,
      forward: noop,
      length: 0,
      state: null,
      scrollRestoration: "auto",
    };
    try {
      History.prototype.replaceState = noop;
      History.prototype.pushState = noop;
    } catch (e) {}
    try {
      Object.defineProperty(window, "history", {
        get: function () { return fakeHistory; },
        configurable: true,
      });
    } catch (e) {}
  }

  patchHistory();

  Office.onReady(function (info) {
    patchHistory();
    if (typeof window._onOfficeReady === "function") {
      window._onOfficeReady();
    }

    console.log("Office.onReady fired. Host:", info.host, "Platform:", info.platform);
    window.__isOfficeHost = !!(info && info.host);

    // Cache-bust the Flutter bootstrap and compiled entrypoint per deployment.
    // Office task panes can retain a previous Flutter web bundle after gh-pages
    // has received a new build. CI replaces the marker with the source commit.
    var buildCommit = "48ffdb4ece8673d01e521870320d830574636781";
    var script = document.createElement("script");
    script.src = "flutter_bootstrap.js?build=" + buildCommit;
    script.onload = function () {
      _flutter.buildConfig = {
        builds: [
          {
            compileTarget: "dart2js",
            renderer: "canvaskit",
            mainJsPath: "main.dart.js?build=" + buildCommit,
          },
        ],
      };
    };
    document.head.appendChild(script);
  });
</script>
</body>
</html>
